[workspace]
members = [ "duckdb-derive", "duckdb-derive-macros" ]
resolver = '2'

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ss123she/duckdb-derive-workspace"
keywords = ["duckdb", "derive", "sql", "database"]
categories = ["database"]

[workspace.dependencies]
duckdb-derive-macros = { version = "0.1.8", path = "duckdb-derive-macros" }
