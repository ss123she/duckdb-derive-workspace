[package]
name = "duckdb-derive"
description = "Derive macros for DuckDB in Rust."

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
duckdb = ">=1.10000, <2.0"
duckdb-derive-macros = { version = "0.1.0", path = "../duckdb-derive-macros" }

[dev-dependencies]
duckdb = { version = "1.20000", features = ["bundled"] }
