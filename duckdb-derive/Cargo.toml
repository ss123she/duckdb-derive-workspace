[package]
name = "duckdb-derive"
description = "Derive macros for DuckDB in Rust."
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
features = ["extra-types"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
duckdb-derive-macros = { workspace = true }
duckdb = { version = ">=1.10000, <2.0", default-features = false }

chrono       = { version = "0.4", optional = true, default-features = false, features = ["std", "clock"] }
uuid         = { version = "1",   optional = true, default-features = false }
rust_decimal = { version = "1",   optional = true, default-features = false }
serde_json   = { version = "1",   optional = true }

[dev-dependencies]
duckdb = { version = "1.20000", default-features = false, features = ["bundled"] }

[features]
default      = []
bundled      = ["duckdb/bundled"]
chrono       = ["dep:chrono", "duckdb/chrono"]
uuid         = ["dep:uuid", "duckdb/uuid"]
rust_decimal = ["dep:rust_decimal", "duckdb/rust_decimal"]
serde_json   = ["dep:serde_json", "duckdb/serde_json"]
extra-types  = ["chrono", "uuid", "rust_decimal", "serde_json"]
