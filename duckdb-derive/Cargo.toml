[package]
name = "duckdb-derive"
version = "0.1.0"
edition = "2024"
description = "Derive macros for DuckDB in Rust."
license = "MIT OR Apache-2.0"

[dependencies]
duckdb = "1.20000"
duckdb-derive-macros = { path = "../duckdb-derive-macros" }

[dev-dependencies]
duckdb = { version = "1.20000", features = ["bundled"] }
